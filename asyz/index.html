<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090c0d">
  <meta name="description" content="奥术勇者 - 横屏网格解析逃生 H5 游戏">
  <title>奥术勇者</title>
  <link rel="stylesheet" href="styles.css?v=20260730">
</head>
<body>
  <main id="app" class="app-shell">
    <section id="home-screen" class="screen active" aria-label="奥术勇者主界面">
      <canvas id="home-canvas" class="screen-canvas" aria-hidden="true"></canvas>
      <header class="topbar home-topbar">
        <div class="resource-readout" aria-label="体力">
          <span class="resource-icon" aria-hidden="true">◆</span>
          <strong id="home-stamina">30/30</strong>
        </div>
        <button id="settings-button" class="icon-button" type="button" title="设置" aria-label="打开设置">⚙</button>
      </header>

      <div class="brand-lockup">
        <span class="brand-kicker">ARCANE RUINS</span>
        <h1>奥术勇者</h1>
      </div>

      <div class="home-hero-readout">
        <span>当前勇者</span>
        <strong id="home-hero-name">奥术勇者</strong>
        <small id="home-hero-stats">移速 4.0 · 体型 0.40</small>
      </div>

      <div class="home-actions">
        <button id="start-button" class="command-button primary" type="button">进入遗迹</button>
        <button id="levels-button" class="command-button secondary" type="button">选择关卡</button>
        <button id="heroes-button" class="command-button secondary" type="button">选择勇者</button>
      </div>
    </section>

    <section id="levels-screen" class="screen section-screen" aria-label="遗迹层级">
      <header class="section-header">
        <button class="icon-button back-button" type="button" title="返回" aria-label="返回">‹</button>
        <h2>遗迹层级</h2>
        <div class="resource-readout compact"><span class="resource-icon">◆</span><strong id="levels-stamina">30/30</strong></div>
      </header>
      <div id="level-list" class="level-list"></div>
      <footer class="section-footer">
        <div class="selection-summary">
          <strong id="selected-level-name">初识回廊</strong>
          <span id="selected-level-detail">目标 90 秒 · 怪物速度 ×1.00</span>
        </div>
        <button id="level-enter-button" class="command-button primary compact-command" type="button">进入关卡</button>
      </footer>
    </section>

    <section id="heroes-screen" class="screen section-screen" aria-label="选择勇者">
      <canvas id="hero-select-canvas" class="hero-select-canvas" aria-label="当前选择勇者"></canvas>
      <header class="section-header overlay-header">
        <button class="icon-button back-button" type="button" title="返回" aria-label="返回">‹</button>
        <h2>选择勇者</h2>
        <span></span>
      </header>
      <div class="hero-detail-readout">
        <h3 id="selected-hero-name">奥术勇者</h3>
        <div class="stat-pair">
          <span>移速 <strong id="selected-hero-speed">4.0</strong></span>
          <span>体型 <strong id="selected-hero-size">0.40</strong></span>
        </div>
      </div>
      <div id="hero-roster" class="hero-roster" role="listbox" aria-label="勇者列表"></div>
      <button id="deploy-button" class="command-button primary deploy-button" type="button">设为出战</button>
    </section>

    <section id="battle-screen" class="screen battle-screen" aria-label="战斗界面">
      <canvas id="battle-canvas" class="battle-canvas" aria-label="奥术遗迹战场"></canvas>
      <header class="battle-header">
        <div class="battle-level-readout">
          <strong id="battle-level-name">初识回廊</strong>
          <span id="battle-time">00:00</span>
        </div>
        <div id="monster-timers" class="monster-timers" aria-label="魔物倒计时"></div>
        <button id="pause-button" class="icon-button" type="button" title="暂停" aria-label="暂停">Ⅱ</button>
      </header>

      <div class="battle-bottom">
        <div id="joystick" class="joystick" aria-label="虚拟摇杆">
          <span id="joystick-knob" class="joystick-knob"></span>
        </div>
        <div class="explore-readout">
          <span>已解析</span>
          <strong id="explore-percent">1%</strong>
        </div>
        <button id="analyze-button" class="analyze-button" type="button">
          <span class="analyze-glyph" aria-hidden="true">◇</span>
          <strong id="analyze-label">按住解析</strong>
          <small id="analyze-cooldown">就绪</small>
        </button>
      </div>
    </section>

    <div id="modal-overlay" class="modal-overlay" aria-hidden="true">
      <section class="modal-window" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div id="modal-emblem" class="modal-emblem" aria-hidden="true">◇</div>
        <h2 id="modal-title">奥术勇者</h2>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </section>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <div class="portrait-guard" aria-hidden="true"><span>↻</span></div>
  </main>

  <noscript>请启用 JavaScript 后运行《奥术勇者》。</noscript>
  <script src="game.js" defer></script>
</body>
</html>
